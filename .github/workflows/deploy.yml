name: deploy

# Pull requests build and test only. A push to main also publishes dist/ to
# GitHub Pages. Pages must be enabled for the repo (Settings -> Pages ->
# Source: GitHub Actions) before the deploy job can succeed; see README.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Dev sign-in must not ship
        run: |
          if grep -rIl -e "Developer sign-in" -e "api_key" dist; then
            echo "dev-only sign-in found in the production bundle" >&2
            exit 1
          fi
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
